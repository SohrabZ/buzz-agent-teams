<rect x="110" y="140" width="140" height="48" rx="4" fill="#26215C" stroke="#7F77DD" stroke-width="0.5"/>
<text class="t" x="180" y="160" text-anchor="middle" fill="#CECBF6">Mason</text>
<text class="s" x="180" y="176" text-anchor="middle" fill="#AFA9EC">never implements</text>
<rect x="54" y="224" width="116" height="44" rx="4" fill="#04342C" stroke="#1D9E75" stroke-width="0.5"/>
<text class="t" x="112" y="244" text-anchor="middle" fill="#9FE1CB">Thistle</text>
<text class="s" x="112" y="260" text-anchor="middle" fill="#5DCAA5">implements</text>
<rect x="190" y="224" width="116" height="44" rx="4" fill="#04342C" stroke="#1D9E75" stroke-width="0.5"/>
<text class="t" x="248" y="244" text-anchor="middle" fill="#9FE1CB">Bramble</text>
<text class="s" x="248" y="260" text-anchor="middle" fill="#5DCAA5">implements</text>
