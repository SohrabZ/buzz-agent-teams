<rect x="40" y="96" width="280" height="250" rx="8" fill="none" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="s" x="54" y="116">Hive · permanent</text>
<rect x="360" y="96" width="280" height="250" rx="8" fill="none" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="s" x="374" y="116">Swarm · temporary</text>
