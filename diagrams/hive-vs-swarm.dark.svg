<text class="t" x="500" y="160" text-anchor="middle" fill="#CECBF6">Comet</text>
<text class="s" x="500" y="176" text-anchor="middle" fill="#AFA9EC">owns the rulebook</text>
<rect x="430" y="216" width="140" height="44" rx="4" fill="#04342C" stroke="#1D9E75" stroke-width="0.5"/>
