<path d="M500 260 L500 288" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M112 268 L112 284 L248 284 L248 268" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M180 284 L180 296" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M570 310 L610 310 L610 164 L570 164" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
<path d="M180 74 L180 136" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M500 74 L500 136" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<rect x="130" y="40" width="100" height="34" rx="4" fill="#2C2C2A" stroke="#888780" stroke-width="0.5"/>
