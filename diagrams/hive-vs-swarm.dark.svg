<svg xmlns="http://www.w3.org/2000/svg" width="680" height="556" viewBox="0 0 680 556" role="img">
<title>Hive and Swarm team topologies</title>
<desc>Two diagrams. Top, the Hive: a person on the left talks directly to three agents — Mason a SmartBee who reviews and judges, Thistle a WorkerBee who designs and builds, and Pollen a QuickBee who runs the legwork. Each agent reads and writes its own slice of memory about the person. Bottom, the Swarm: the person sets a goal with a single coordinator, which fans work out to a pool of migrators and an independent verifier. Those escalate back to the coordinator, which writes each ruling to memory and forwards only new edge cases to the person.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}.t{font-size:14px;font-weight:600;fill:#D3D1C7}.s{font-size:12px;fill:#B4B2A9}.h{font-size:11px;font-weight:600;fill:#888780;letter-spacing:0.08em}</style>
