<svg xmlns="http://www.w3.org/2000/svg" width="680" height="406" viewBox="0 0 680 406" role="img">
<title>Hive versus Swarm team shapes</title>
<desc>Side by side. The Hive is a permanent team: you talk to Mason, who assigns work to Thistle and Bramble, and those two verify each other. The Swarm is a temporary team: you talk to Comet, who assigns batches to Clover, whose work goes to Willow for verification, and the verdict returns to Comet.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}.t{font-size:14px;font-weight:500;fill:#D3D1C7}.s{font-size:12px;fill:#B4B2A9}</style>
